<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #e6edf3;

    line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header {
    border-bottom: 1px solid #30363d;
    padding: 24px 0; margin-bottom: 32px;
}
header h1 { font-size: 1.6rem; font-weight: 600; }
header p { color: #8b949e; font-size: 0.9rem; margin-top: 4px; }

.kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 32px;
}
.kpi-card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 20px;
}
.kpi-card .value { font-size: 2rem; font-weight: 700; }
.kpi-card .label { color: #8b949e; font-size: 0.85rem; margin-top: 4px; }

.chart-section { margin-bottom: 40px; }
.chart-section .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
}
.chart-section h2 { font-size: 1.1rem; font-weight: 600; }
.chart-section a.detail-link {
    color: #58a6ff; text-decoration: none; font-size: 0.85rem;
}
.chart-section a.detail-link:hover { text-decoration: underline; }

.two-col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
@media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }

footer {
    border-top: 1px solid #30363d; padding: 24px 0; margin-top: 40px;
    color: #8b949e; font-size: 0.8rem; text-align: center;
}
nav a { color: #58a6ff; text-decoration: none; margin: 0 12px; }
nav a:hover { text-decoration: underline; }

.range-btns {
    display: flex; gap: 4px; margin-bottom: 8px;
}
.range-btns button {
    background: #161b22; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 4px; padding: 3px 10px; font-size: 0.8rem;
    cursor: pointer; font-family: inherit;
}
.range-btns button:hover { border-color: #58a6ff; }
.range-btns button.active {
    background: #58a6ff; color: #fff; border-color: #58a6ff;
}
</style>
</head>

<script>
(function() {
    var gd = document.getElementById('plot-4');
    if (!gd) return;
    

    // Gather all x timestamps and compute data bounds
    var allX = [];
    gd.data.forEach(function(t) {
        if (t.x) for (var i = 0; i < t.x.length; i++) allX.push(new Date(t.x[i]).getTime());
    });
    var dataMax = allX.length ? new Date(Math.max.apply(null, allX)) : new Date();
    var dataMin = allX.length ? new Date(Math.min.apply(null, allX)) : new Date();

    // Detect if Y-axis is categorical (string values — no numeric rescale)
    var isCategoricalY = false;
    gd.data.forEach(function(t) {
        if (t.y && t.y.length && typeof t.y[0] === 'string') isCategoricalY = true;
    });

    function setRange(months) {
        var x0, x1 = dataMax.toISOString();
        if (months === 0) {
            x0 = dataMin.toISOString();
        } else {
            var d = new Date(dataMax);
            d.setMonth(d.getMonth() - months);
            x0 = d.toISOString();
        }
        Plotly.relayout(gd, {'xaxis.range': [x0, x1]});
    }

    function rescaleY() {
        if (isCategoricalY) return;
        var range = gd.layout.xaxis.range;
        if (!range || range.length < 2) return;
        var lo = new Date(range[0]).getTime(), hi = new Date(range[1]).getTime();
        if (isNaN(lo) || isNaN(hi)) return;
        var yMax = 0;
        gd.data.forEach(function(trace) {
            if (!trace.x) return;
            for (var i = 0; i < trace.x.length; i++) {
                var t = new Date(trace.x[i]).getTime();
                if (t >= lo && t <= hi) {
                    var v = Math.abs(trace.y[i]);
                    if (v > yMax) yMax = v;
                }
            }
        });
        if (yMax > 0) {
            Plotly.relayout(gd, {'yaxis.range': [0, yMax * 1.1], 'yaxis.autorange': false});
        }
    }

    // Wire up custom range buttons
    var btns = document.querySelectorAll('#rng-plot-4 button');
    btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            btns.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            setRange(parseInt(btn.dataset.months));
            setTimeout(rescaleY, 50);
        });
    });

    // Auto Y-rescale on drag-zoom / rangeslider interaction
    var skipNext = false;
    gd.on('plotly_relayout', function(ed) {
        if (skipNext) { skipNext = false; return; }
        var hasX = ed['xaxis.range[0]'] !== undefined
                || ed['xaxis.range'] !== undefined;
        if (!hasX) return;
        skipNext = true;
        rescaleY();
    });

    // Apply default range
    if (0 > 0) {
        setRange(0);
        setTimeout(rescaleY, 50);
    }
})();
</script>
